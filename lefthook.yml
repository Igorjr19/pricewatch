pre-commit:
  commands:
    biome:
      glob: "*.{ts,json}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    typecheck:
      run: pnpm exec tsc --noEmit

commit-msg:
  commands:
    conventional:
      run: |
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || {
          echo "commit subject must follow Conventional Commits: type(scope)?: description" >&2
          exit 1
        }
