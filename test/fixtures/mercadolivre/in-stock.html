cotidianos em lindas memórias. A maior abertura de lente em um smartphone permite a captura de muito mais luz. O foco automático a laser age em um instante para você não perder nada. A Estabilização óptica de imagem (OIS) elimina iqualquer tremor para que suas fotos fiquem sempre nítidas.\n\nQualidade profissional. Nem precisa ser profissional:\nEleve a qualidade dos seus cliques com o Max Foto Pro, que melhora o alcance dinâmico, aumentando a proporção entre o brilho e as partes mais escuras de uma imagem. Os detalhes também ficam mais precisos e a Inteligência Artificial entrega efeito bokeh baseado em software e redução avançada de ruído nos ambientes com pouca iluminação.\n\nCapture a vida em movimento:\nNovos recursos com Inteligência Artificial tornam mais fácil obter ótimos resultados em qualquer situação. A Estabilização inteligente usa Inteligência Artificial para reconhecer os movimentos durante a filmagem e ajusta dinamicamente o nível de estabilização para gerar os melhores resultados. O Rastreio do foco automático produz imagens nítidas ao usar Inteligência Artificial para manter o foco mesmo que haja movimento no quadro. E deixe a criatividade te guiar com a Exposição longa.\n\nUltra-wide ou close-up, você escolhe:\nA lente ultra-wide de 120° captura exatamente o que seus olhos veem, enquadrando mais do cenário que as lentes padrão. Use a lente macro e chegue 4x mais perto para capturar os mínimos detalhes.\n\nMatch de estilo:\nCrie planos de fundo e temas que combinam com seu estilo único. Pode ser uma foto da sua roupa ou uma ilustração interessante, e o motorola edge 50 pro usa Inteligência Artificial generativa para produzir quatro imagens únicas. Escolha a sua preferida e defina como seu plano de fundo.\n\nCores Pantone Validated:\nO motorola edge 50 pro é o primeiro dispositivo do mundo com uma tela com cores validadas pela Pantone. Isso significa que ele possui uma tela que simula de forma autêntica as cores como elas realmente são, inclusive tons de pele.\n\nImersão infinita:\nQualidade de cinema - Veja além dos limites com o display pOLED de 6,7 com borda infinita.\nSuper HD - Assista a filmes e séries em HDR10+ com bilhões de tonalidades realistas.\nUltrarrápido. Ultrafluido - Rapidez ao jogar e navegar pelos seus apps com uma taxa de atualização incrivelmente rápida de 144 Hz.\nÁudio sem igual - Ouça suas músicas e vídeos na qualidade que eles merecem com o Dolby Atmos.\n\nComo usar o RAM Boost:\nA Otimização de Ram (RAM Boost) transforma o armazenamento em RAM virtual sempre que você precisa de mais velocidade. Por padrão,\nesse recurso fica sempre ativado, fazendo com que o telefone se adapte conforme necessário, adicionando 12GB de RAM extra para ajudar no processo quando necessário.\n\nGerencie este recurso em CONFIGURAR> SISTEMA> DESEMPENHO e selecione OTIMIZAÇÃO DE RAM.\n\n12GB MEMÓRIA RAM (Memória do dispositivo) +12GB MEMÓRIA BOOST (Otimização da RAM). *O armazenamento do telefone é usado para aumentara RAM e otimizar o desempenho.\n\n\nTela:\nTamanho: 6,7\nResolução: Super HD (1220 x 2712)\nCaracterística: HDR10+ | pOLED | 144 Hz\nProporção: 20:9\nDensidade de Pixels: 446 ppi\nNúmero de cores: 1 Bilhão\nBrilho (Pico): 2000 Nits\nProteção: Gorilla Glass 5\n\n\nPerformance:\nSistema Operacional: Android 14\nProcessador: Snapdragon 7 Gen 3 (2,6 GHz Octa-Core)\nGPU: Adreno 720\nArmazenamento Total: 256 GB\nArmazenamento Disponível 235 GB\nMemória RAM: 12GB + 12GB RAM Boost*\nModelo SIM Card (Chip): Nano SIM (4FF) | e-SIM\nMemória Externa: Não\nEntrada do Chip: e-SIM \u002F Entrada 1: Chip 1\n\nBateria:\nCapacidade: 4500 mAh\nTipo de Conector: USB-C\nTipo de Carregador: TurboPower 125 W\nCarregamento Wireless: TurboPower 50 W\nCompartilhamento de bateria: 10 W\n\nCâmera Frontal:\n50 MP | Lente 89,3° | Abertura f\u002F1,95 | Auto Foco\nFlash Frontal: Na Tela\nFormato de Gravação de Vídeo: MP4\nResolução de Gravação de Vídeo: Ultra HD 4K (30 fps)\n\nCâmera Traseira:\n50 MP OIS + 13 MP + 10 MP OIS\nCâ
